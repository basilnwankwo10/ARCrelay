[project]
name = "arcrelay-policy-engine"
version = "0.1.0"
description = "High-throughput asynchronous JSON-RPC Policy Engine and EIP-712 Signing Daemon for ArcRelay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "eth-account>=0.11.0",
    "web3>=6.15.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcrelay_policy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
